[project]
name = "structrag"
version = "0.1.0"
description = "Local-first agentic RAG: heuristic structure-aware ingestion with an LLM fallback for ambiguous documents."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "pdfminer.six>=20240706",
]

[project.optional-dependencies]
local = ["fastembed>=0.7"]
ocr = ["rapidocr>=3.9", "pypdfium2>=4", "pillow>=10"]
pii = ["transformers>=4.45", "torch>=2.3"]
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
structrag = "structrag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/structrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
