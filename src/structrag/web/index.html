<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>structrag</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e8ee; --dim:#8b93a5; --acc:#6ea8fe; --ok:#5fd38d; --warn:#f2b85b; --bad:#ef6f6f; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:grid; grid-template-columns: 300px 1fr; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, sans-serif; }
  aside { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; }
  aside h3 { margin:14px 14px 6px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .list { overflow-y:auto; padding:0 8px; }
  .item { display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:6px; cursor:pointer; }
  .item:hover, .item.active { background:#20242e; }
  .item .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { font-size:10px; padding:1px 6px; border-radius:9px; border:1px solid var(--line); color:var(--dim); }
  .badge.ok { color:var(--ok); } .badge.review { color:var(--warn); } .badge.needs_ocr { color:var(--bad); }
  button { background:#20242e; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  .x { padding:0 6px; border:none; background:none; color:var(--dim); }
  #drop { margin:8px 14px; padding:14px; border:1px dashed var(--line); border-radius:8px; text-align:center; color:var(--dim); }
  #drop.over { border-color:var(--acc); color:var(--acc); }
  main { display:flex; flex-direction:column; min-width:0; }
  header { padding:10px 18px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; }
  header .sp { flex:1; }
  #status { font-size:12px; color:var(--dim); }
  #msgs { flex:1; overflow-y:auto; padding:18px; }
  .msg { max-width:820px; margin:0 auto 18px; }
  .msg .who { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  .msg .body { white-space:pre-wrap; margin-top:2px; }
  .cite { color:var(--acc); cursor:pointer; font-weight:600; }
  .srcs { margin-top:8px; display:flex; flex-direction:column; gap:4px; }
  .src { border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:12px; color:var(--dim); }
  .src b { color:var(--text); } .src pre { display:none; white-space:pre-wrap; margin:6px 0 0; color:var(--text); }
  .src.open pre { display:block; }
  form { padding:12px 18px 18px; max-width:860px; width:100%; margin:0 auto; display:flex; gap:8px; }
  textarea { flex:1; resize:none; height:52px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; }
  #review { display:none; padding:18px; overflow-y:auto; }
  .card { max-width:820px; margin:0 auto 12px; border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:12px; }
  .card .opts { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .dim { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<aside>
  <div style="padding:14px"><button id="newchat" style="width:100%">+ New chat</button></div>
  <div id="drop">Drop PDF, DOCX, PPTX, XLSX, MD here<br><span class="dim">or click to choose</span>
    <input id="file" type="file" multiple hidden accept=".pdf,.docx,.pptx,.xlsx,.md,.markdown,.txt"></div>
  <h3>Chats</h3><div id="sessions" class="list" style="max-height:28%"></div>
  <h3>Documents <span class="dim" id="scope"></span></h3><div id="docs" class="list" style="flex:1"></div>
  <div style="padding:10px 14px;border-top:1px solid var(--line)"><button id="reviewbtn" style="width:100%">Review queue (0)</button></div>
</aside>
<main>
  <header><b>structrag</b><span id="status">connecting...</span><span class="sp"></span><span class="dim">100% local</span></header>
  <div id="msgs"></div>
  <div id="review"></div>
  <form id="form"><textarea id="q" placeholder="Ask about your documents..." autofocus></textarea><button>Send</button></form>
</main>
<script>
const $ = (id) => document.getElementById(id);
const H = { 'X-Requested-With': 'structrag' };
let session = null, selected = new Set(), busy = false;

const api = async (path, opts = {}) => {
  const r = await fetch(path, { ...opts, headers: { ...H, ...(opts.body && !(opts.body instanceof FormData) ? { 'Content-Type': 'application/json' } : {}), ...opts.headers } });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r;
};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };

function renderText(container, text, sources) {
  container.replaceChildren();
  text.split(/(\[\d+\])/).forEach((part) => {
    const m = part.match(/^\[(\d+)\]$/);
    if (!m) return container.append(part);
    const s = el('span', 'cite', part);
    s.onclick = () => container.parentElement.querySelectorAll('.src')[m[1] - 1]?.classList.toggle('open');
    container.append(s);
  });
}
function addMessage(role, text, sources = []) {
  const box = el('div', 'msg'); box.append(el('div', 'who', role === 'user' ? 'You' : 'Assistant'));
  const body = el('div', 'body'); box.append(body); renderText(body, text);
  const list = el('div', 'srcs'); box.append(list); setSources(list, sources);
  $('msgs').append(box); $('msgs').scrollTop = $('msgs').scrollHeight;
  return { body, list };
}
function setSources(list, sources) {
  list.replaceChildren();
  sources.forEach((s) => {
    const d = el('div', 'src'); const head = el('div'); head.append(el('b', '', `[${s.n}] ${s.doc}`), ` > ${s.section} (${s.loc || 'n/a'})`);
    head.style.cursor = 'pointer'; head.onclick = () => d.classList.toggle('open');
    d.append(head, el('pre', '', s.text)); list.append(d);
  });
}

async function refresh() {
  const [docs, sessions, review, health] = await Promise.all(['/api/docs', '/api/sessions', '/api/review', '/api/health'].map((p) => api(p).then((r) => r.json())));
  $('status').textContent = health.ok ? `models: ${health.chat_ready ? 'chat ok' : 'chat missing'}, ${health.embed_ready || health.embedder === 'hash' ? 'embed ok' : 'embed missing'}` : 'model server offline (start Ollama)';
  $('reviewbtn').textContent = `Review queue (${review.length})`;
  $('scope').textContent = selected.size ? `(${selected.size} selected)` : '(all)';
  $('docs').replaceChildren(...docs.map((d) => {
    const row = el('div', 'item' + (selected.has(d.id) ? ' active' : ''));
    row.title = `${d.n_sections} sections, ${d.n_chunks} chunks, ${d.strategy || '-'} (${d.confidence.toFixed(2)})\n${d.warnings.join('\n')}`;
    row.onclick = () => { selected.has(d.id) ? selected.delete(d.id) : selected.add(d.id); refresh(); };
    const del = el('button', 'x', '×'); del.onclick = async (e) => { e.stopPropagation(); await api(`/api/docs/${d.id}`, { method: 'DELETE' }); selected.delete(d.id); refresh(); };
    row.append(el('span', 't', d.title), el('span', 'badge ' + d.status, d.status), del); return row;
  }));
  $('sessions').replaceChildren(...sessions.map((s) => {
    const row = el('div', 'item' + (s.id === session ? ' active' : '')); row.onclick = () => openSession(s.id);
    const del = el('button', 'x', '×'); del.onclick = async (e) => { e.stopPropagation(); await api(`/api/sessions/${s.id}`, { method: 'DELETE' }); if (session === s.id) session = null, $('msgs').replaceChildren(); refresh(); };
    row.append(el('span', 't', s.title), del); return row;
  }));
  return review;
}
async function openSession(id) {
  session = id; showChat(); $('msgs').replaceChildren();
  (await (await api(`/api/sessions/${id}`)).json()).messages.forEach((m) => addMessage(m.role, m.content, m.sources.map((s, i) => ({ n: i + 1, ...s }))));
  refresh();
}
function showChat() { $('review').style.display = 'none'; $('msgs').style.display = ''; $('form').style.display = ''; }

$('newchat').onclick = async () => { session = (await (await api('/api/sessions', { method: 'POST', body: JSON.stringify({}) })).json()).id; showChat(); $('msgs').replaceChildren(); refresh(); };

$('form').onsubmit = async (e) => {
  e.preventDefault(); const message = $('q').value.trim(); if (!message || busy) return;
  if (!session) await $('newchat').onclick();
  busy = true; $('q').value = ''; addMessage('user', message);
  const out = addMessage('assistant', ''); let text = '', sources = [];
  try {
    const r = await api('/api/chat', { method: 'POST', body: JSON.stringify({ session_id: session, message, doc_ids: selected.size ? [...selected] : null }) });
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      const events = buf.split('\n\n'); buf = events.pop();
      for (const line of events) {
        if (!line.startsWith('data:')) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.type === 'sources') { sources = ev.sources; setSources(out.list, sources); }
        else if (ev.type === 'token') { text += ev.text; out.body.textContent = text; $('msgs').scrollTop = $('msgs').scrollHeight; }
        else if (ev.type === 'error') out.body.textContent = text + '\n[error] ' + ev.text;
      }
    }
    renderText(out.body, text);
  } catch (err) { out.body.textContent = 'Error: ' + err.message; }
  busy = false; refresh();
};
$('q').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); } };

async function upload(files) {
  if (!files.length) return; const fd = new FormData(); [...files].forEach((f) => fd.append('files', f));
  $('drop').firstChild.textContent = 'Uploading... ';
  try { await api('/api/upload', { method: 'POST', body: fd }); } catch (e) { alert(e.message); }
  $('drop').firstChild.textContent = 'Drop PDF, DOCX, PPTX, XLSX, MD here'; poll();
}
async function poll() {
  const jobs = await (await api('/api/jobs')).json(); await refresh();
  if (jobs.some((j) => j.state === 'running')) setTimeout(poll, 1500);
}
$('drop').onclick = () => $('file').click(); $('file').onchange = (e) => upload(e.target.files);
$('drop').ondragover = (e) => { e.preventDefault(); $('drop').classList.add('over'); };
$('drop').ondragleave = () => $('drop').classList.remove('over');
$('drop').ondrop = (e) => { e.preventDefault(); $('drop').classList.remove('over'); upload(e.dataTransfer.files); };

$('reviewbtn').onclick = async () => {
  $('msgs').style.display = 'none'; $('form').style.display = 'none'; $('review').style.display = 'block';
  const items = await (await api('/api/review')).json(); const box = $('review'); box.replaceChildren();
  if (!items.length) box.append(el('div', 'dim', 'Nothing to review: every structure decision was confident.'));
  items.forEach((it) => {
    const c = el('div', 'card'); c.append(el('div', 'dim', `${it.doc_title} - ${it.kind}`), el('div', '', it.text));
    c.append(el('div', 'dim', 'model confidence: ' + Object.entries(it.probs).map(([k, v]) => `${k}=${v.toFixed(2)}`).join(', ')));
    const opts = el('div', 'opts');
    Object.entries(it.options).forEach(([k, d]) => { const b = el('button', '', `${k}) ${d}`); b.onclick = async () => { b.disabled = true; await api(`/api/review/${it.id}`, { method: 'POST', body: JSON.stringify({ choice: k }) }); $('reviewbtn').onclick(); refresh(); }; opts.append(b); });
    c.append(opts); box.append(c);
  });
};

refresh(); setInterval(() => { if (!busy) refresh(); }, 15000);
</script>
</body>
</html>
