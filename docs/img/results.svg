<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 505" width="1200" height="505" role="img" aria-label="Bar chart of benchmark results, all between 94.7% and 98.3%"><title>Bar chart of benchmark results, all between 94.7% and 98.3%</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs><style>text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#e6edf3}.d{fill:#8b949e}.b{font-weight:700}</style><rect width="1200" height="505" rx="18" fill="#0d1117"/><text x="60" y="50" font-size="26" class="b" text-anchor="start">Measured results</text><text x="60" y="74" font-size="14" class="d" text-anchor="start">237 questions over 28 real documents (arXiv, Wikipedia EN/IT, 872-page DOCX, 369-slide PPTX, XLSX) in a single index.</text><line x1="330.0" y1="100" x2="330.0" y2="422" stroke="#30363d" stroke-width="1"/><text x="330.0" y="440" font-size="11" class="d" text-anchor="middle">0%</text><line x1="515.0" y1="100" x2="515.0" y2="422" stroke="#30363d" stroke-width="1"/><text x="515.0" y="440" font-size="11" class="d" text-anchor="middle">25%</text><line x1="700.0" y1="100" x2="700.0" y2="422" stroke="#30363d" stroke-width="1"/><text x="700.0" y="440" font-size="11" class="d" text-anchor="middle">50%</text><line x1="885.0" y1="100" x2="885.0" y2="422" stroke="#30363d" stroke-width="1"/><text x="885.0" y="440" font-size="11" class="d" text-anchor="middle">75%</text><line x1="1070.0" y1="100" x2="1070.0" y2="422" stroke="#30363d" stroke-width="1"/><text x="1070.0" y="440" font-size="11" class="d" text-anchor="middle">100%</text><text x="314" y="132" font-size="13.5" class="" text-anchor="end">Correct answers</text><rect x="330" y="110" width="700.8" height="30" rx="6" fill="#2dd4bf"/><text x="1040.78" y="131" font-size="14" class="b" text-anchor="start">94.7%</text><text x="314" y="184" font-size="13.5" class="" text-anchor="end">Precision of answers given</text><rect x="330" y="162" width="711.9" height="30" rx="6" fill="#2dd4bf"/><text x="1051.88" y="183" font-size="14" class="b" text-anchor="start">96.2%</text><text x="314" y="236" font-size="13.5" class="" text-anchor="end">Unanswerable refused</text><rect x="330" y="214" width="710.4" height="30" rx="6" fill="#2dd4bf"/><text x="1050.4" y="235" font-size="14" class="b" text-anchor="start">96.0%</text><text x="314" y="288" font-size="13.5" class="" text-anchor="end">Citations verified</text><rect x="330" y="266" width="727.4" height="30" rx="6" fill="#2dd4bf"/><text x="1067.42" y="287" font-size="14" class="b" text-anchor="start">98.3%</text><text x="314" y="340" font-size="13.5" class="" text-anchor="end">Chunk hit@8</text><rect x="330" y="318" width="724.5" height="30" rx="6" fill="#60a5fa"/><text x="1064.46" y="339" font-size="14" class="b" text-anchor="start">97.9%</text><text x="314" y="392" font-size="13.5" class="" text-anchor="end">Correct, held-out set (61 q)</text><rect x="330" y="370" width="725.9" height="30" rx="6" fill="#60a5fa"/><text x="1065.94" y="391" font-size="14" class="b" text-anchor="start">98.1%</text><text x="60" y="472" font-size="12" class="d" text-anchor="start">Teal: full 237-question run. Blue: retrieval and held-out views. Local Qwen3-4B on a laptop GPU; retrieval median 1.7 s, answer mean 3.9 s.</text></svg>