<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="1200" height="550" role="img" aria-label="Structure inference cascade with a local LLM agent and human review"><title>Structure inference cascade with a local LLM agent and human review</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs><style>text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#e6edf3}.d{fill:#8b949e}.b{font-weight:700}</style><rect width="1200" height="550" rx="18" fill="#0d1117"/><text x="60" y="50" font-size="26" class="b" text-anchor="start">Structure cascade</text><text x="60" y="74" font-size="14" class="d" text-anchor="start">Cheap deterministic signals first. The model is asked only what they cannot settle, and only as a multiple-choice question.</text><rect x="60" y="110" width="250" height="92" rx="12" fill="#161b22" stroke="#2dd4bf" stroke-width="1.5"/><rect x="60" y="122" width="4" height="68" rx="2" fill="#2dd4bf"/><text x="78" y="137" font-size="15" class="b" text-anchor="start">1  Explicit</text><text x="78" y="157" font-size="12" class="d" text-anchor="start">styles, bookmarks</text><text x="78" y="174" font-size="12" class="d" text-anchor="start">confidence 0.95</text><rect x="340" y="110" width="250" height="92" rx="12" fill="#161b22" stroke="#60a5fa" stroke-width="1.5"/><rect x="340" y="122" width="4" height="68" rx="2" fill="#60a5fa"/><text x="358" y="137" font-size="15" class="b" text-anchor="start">2  Learned profile</text><text x="358" y="157" font-size="12" class="d" text-anchor="start">layouts seen before</text><text x="358" y="174" font-size="12" class="d" text-anchor="start">confidence 0.90</text><path d="M310 156L336 156" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="620" y="110" width="250" height="92" rx="12" fill="#161b22" stroke="#a78bfa" stroke-width="1.5"/><rect x="620" y="122" width="4" height="68" rx="2" fill="#a78bfa"/><text x="638" y="137" font-size="15" class="b" text-anchor="start">3  Numbering + type</text><text x="638" y="157" font-size="12" class="d" text-anchor="start">3.2 Method, font size,</text><text x="638" y="174" font-size="12" class="d" text-anchor="start">bold, caps</text><path d="M590 156L616 156" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="900" y="110" width="250" height="92" rx="12" fill="#161b22" stroke="#fbbf24" stroke-width="1.5"/><rect x="900" y="122" width="4" height="68" rx="2" fill="#fbbf24"/><text x="918" y="137" font-size="15" class="b" text-anchor="start">4  Shape</text><text x="918" y="157" font-size="12" class="d" text-anchor="start">short line before</text><text x="918" y="174" font-size="12" class="d" text-anchor="start">a long paragraph</text><path d="M870 156L896 156" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M1050 202L1050 232L320 232L320 258" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)" stroke-dasharray="4 4"/><text x="1060" y="224" font-size="12" class="d" text-anchor="end">only what is ambiguous</text><rect x="60" y="262" width="520" height="120" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><rect x="60" y="274" width="4" height="96" rx="2" fill="#3fb950"/><text x="78" y="289" font-size="15" class="b" text-anchor="start">5  Structure agent (local LLM)</text><text x="78" y="309" font-size="12" class="d" text-anchor="start">A) section heading   B) body, caption or label</text><text x="78" y="326" font-size="12" class="d" text-anchor="start">decides by token probability, not free text; p ≥ 0.70 to apply</text><rect x="620" y="262" width="520" height="120" rx="12" fill="#161b22" stroke="#fbbf24" stroke-width="1.5"/><rect x="620" y="274" width="4" height="96" rx="2" fill="#fbbf24"/><text x="638" y="289" font-size="15" class="b" text-anchor="start">6  Human review queue</text><text x="638" y="309" font-size="12" class="d" text-anchor="start">below 0.70 nothing is applied: the heuristic</text><text x="638" y="326" font-size="12" class="d" text-anchor="start">structure stays and the case waits for you</text><path d="M580 322L616 322" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/><text x="600" y="418" font-size="12.5" class="d" text-anchor="middle">every agreeing decision is stored per layout (profiles/): the model is paid once per layout, a human answer weighs three votes</text><rect x="60" y="446" width="250" height="78" rx="12" fill="#161b22" stroke="#30363d"/><text x="76" y="480" font-size="20" class="b" text-anchor="start" fill="#2dd4bf">~100 → ~50</text><text x="76" y="504" font-size="12" class="d" text-anchor="start">sections per Wikipedia article</text><rect x="340" y="446" width="250" height="78" rx="12" fill="#161b22" stroke="#30363d"/><text x="356" y="480" font-size="20" class="b" text-anchor="start" fill="#60a5fa">0.5–0.7 → 0.85–0.9</text><text x="356" y="504" font-size="12" class="d" text-anchor="start">structure confidence</text><rect x="620" y="446" width="250" height="78" rx="12" fill="#161b22" stroke="#30363d"/><text x="636" y="480" font-size="20" class="b" text-anchor="start" fill="#a78bfa">93.6% → 95.2%</text><text x="636" y="504" font-size="12" class="d" text-anchor="start">chunk hit@5</text><rect x="900" y="446" width="250" height="78" rx="12" fill="#161b22" stroke="#30363d"/><text x="916" y="480" font-size="20" class="b" text-anchor="start" fill="#fbbf24">95.2% → 97.9%</text><text x="916" y="504" font-size="12" class="d" text-anchor="start">chunk hit@8</text></svg>