<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="structrag architecture: ingest pipeline and question-answering pipeline"><title>structrag architecture: ingest pipeline and question-answering pipeline</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs><style>text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#e6edf3}.d{fill:#8b949e}.b{font-weight:700}</style><rect width="1200" height="560" rx="18" fill="#0d1117"/><text x="60" y="50" font-size="26" class="b" text-anchor="start">Architecture</text><text x="60" y="74" font-size="14" class="d" text-anchor="start">One pipeline in, one pipeline out. Every stage is local, every decision is inspectable.</text><rect x="40" y="96" width="1120" height="170" rx="16" fill="none" stroke="#30363d" stroke-dasharray="5 5"/><text x="58" y="120" font-size="12" class="b d" text-anchor="start">INGEST</text><rect x="58" y="140" width="190" height="100" rx="12" fill="#161b22" stroke="#2dd4bf" stroke-width="1.5"/><rect x="58" y="152" width="4" height="76" rx="2" fill="#2dd4bf"/><text x="76" y="167" font-size="15" class="b" text-anchor="start">Parsers</text><text x="76" y="187" font-size="12" class="d" text-anchor="start">PDF · DOCX · PPTX</text><text x="76" y="204" font-size="12" class="d" text-anchor="start">XLSX · MD · images</text><rect x="276" y="140" width="190" height="100" rx="12" fill="#161b22" stroke="#60a5fa" stroke-width="1.5"/><rect x="276" y="152" width="4" height="76" rx="2" fill="#60a5fa"/><text x="294" y="167" font-size="15" class="b" text-anchor="start">Structure</text><text x="294" y="187" font-size="12" class="d" text-anchor="start">heuristics first,</text><text x="294" y="204" font-size="12" class="d" text-anchor="start">agent if ambiguous</text><path d="M250 190L272 190" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="494" y="140" width="190" height="100" rx="12" fill="#161b22" stroke="#a78bfa" stroke-width="1.5"/><rect x="494" y="152" width="4" height="76" rx="2" fill="#a78bfa"/><text x="512" y="167" font-size="15" class="b" text-anchor="start">Chunker</text><text x="512" y="187" font-size="12" class="d" text-anchor="start">per section, with</text><text x="512" y="204" font-size="12" class="d" text-anchor="start">breadcrumb; table rows</text><path d="M468 190L490 190" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="712" y="140" width="190" height="100" rx="12" fill="#161b22" stroke="#fbbf24" stroke-width="1.5"/><rect x="712" y="152" width="4" height="76" rx="2" fill="#fbbf24"/><text x="730" y="167" font-size="15" class="b" text-anchor="start">PII mask</text><text x="730" y="187" font-size="12" class="d" text-anchor="start">optional, before</text><text x="730" y="204" font-size="12" class="d" text-anchor="start">anything is stored</text><path d="M686 190L708 190" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="930" y="140" width="190" height="100" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><rect x="930" y="152" width="4" height="76" rx="2" fill="#3fb950"/><text x="948" y="167" font-size="15" class="b" text-anchor="start">Index</text><text x="948" y="187" font-size="12" class="d" text-anchor="start">e5 embeddings, FTS5,</text><text x="948" y="204" font-size="12" class="d" text-anchor="start">section + doc cards</text><path d="M904 190L926 190" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="40" y="290" width="1120" height="170" rx="16" fill="none" stroke="#30363d" stroke-dasharray="5 5"/><text x="58" y="314" font-size="12" class="b d" text-anchor="start">ASK</text><rect x="58" y="334" width="190" height="100" rx="12" fill="#161b22" stroke="#2dd4bf" stroke-width="1.5"/><rect x="58" y="346" width="4" height="76" rx="2" fill="#2dd4bf"/><text x="76" y="361" font-size="15" class="b" text-anchor="start">Hybrid retrieval</text><text x="76" y="381" font-size="12" class="d" text-anchor="start">doc card → sections</text><text x="76" y="398" font-size="12" class="d" text-anchor="start">+ dense + BM25, RRF</text><rect x="276" y="334" width="190" height="100" rx="12" fill="#161b22" stroke="#60a5fa" stroke-width="1.5"/><rect x="276" y="346" width="4" height="76" rx="2" fill="#60a5fa"/><text x="294" y="361" font-size="15" class="b" text-anchor="start">Reranker</text><text x="294" y="381" font-size="12" class="d" text-anchor="start">cross-encoder int8,</text><text x="294" y="398" font-size="12" class="d" text-anchor="start">top 30 on CPU</text><path d="M250 384L272 384" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="494" y="334" width="190" height="100" rx="12" fill="#161b22" stroke="#a78bfa" stroke-width="1.5"/><rect x="494" y="346" width="4" height="76" rx="2" fill="#a78bfa"/><text x="512" y="361" font-size="15" class="b" text-anchor="start">Reference graph</text><text x="512" y="381" font-size="12" class="d" text-anchor="start">cited figure / table /</text><text x="512" y="398" font-size="12" class="d" text-anchor="start">section, one hop</text><path d="M468 384L490 384" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="712" y="334" width="190" height="100" rx="12" fill="#161b22" stroke="#fbbf24" stroke-width="1.5"/><rect x="712" y="346" width="4" height="76" rx="2" fill="#fbbf24"/><text x="730" y="361" font-size="15" class="b" text-anchor="start">Relevance gate</text><text x="730" y="381" font-size="12" class="d" text-anchor="start">no relevant passage:</text><text x="730" y="398" font-size="12" class="d" text-anchor="start">model never called</text><path d="M686 384L708 384" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="930" y="334" width="190" height="100" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><rect x="930" y="346" width="4" height="76" rx="2" fill="#3fb950"/><text x="948" y="361" font-size="15" class="b" text-anchor="start">Grounded answer</text><text x="948" y="381" font-size="12" class="d" text-anchor="start">every sentence checked,</text><text x="948" y="398" font-size="12" class="d" text-anchor="start">quote + citation</text><path d="M904 384L926 384" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M1063 240L1063 280L150 280L150 328" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)" stroke-dasharray="4 4"/><text x="600" y="274" font-size="11" class="d" text-anchor="middle">index read at question time</text><rect x="58" y="486" width="254" height="44" rx="22" fill="#161b22" stroke="#2dd4bf"/><text x="185" y="514" font-size="13" class="" text-anchor="middle">FastAPI + web dashboard</text><rect x="334" y="486" width="254" height="44" rx="22" fill="#161b22" stroke="#60a5fa"/><text x="461" y="514" font-size="13" class="" text-anchor="middle">CLI: ingest · ask · serve</text><rect x="610" y="486" width="254" height="44" rx="22" fill="#161b22" stroke="#a78bfa"/><text x="737" y="514" font-size="13" class="" text-anchor="middle">Inbox watcher / sync</text><rect x="886" y="486" width="254" height="44" rx="22" fill="#161b22" stroke="#fbbf24"/><text x="1013" y="514" font-size="13" class="" text-anchor="middle">Human review queue</text></svg>