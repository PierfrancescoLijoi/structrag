<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="Grounding pipeline: relevance gate, cited generation, sentence check, quote"><title>Grounding pipeline: relevance gate, cited generation, sentence check, quote</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs><style>text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#e6edf3}.d{fill:#8b949e}.b{font-weight:700}</style><rect width="1200" height="350" rx="18" fill="#0d1117"/><text x="60" y="50" font-size="26" class="b" text-anchor="start">Grounded answers</text><text x="60" y="74" font-size="14" class="d" text-anchor="start">Nothing unverified reaches the user.</text><rect x="40" y="100" width="208" height="100" rx="12" fill="#161b22" stroke="#2dd4bf" stroke-width="1.5"/><rect x="40" y="112" width="4" height="76" rx="2" fill="#2dd4bf"/><text x="58" y="127" font-size="15" class="b" text-anchor="start">Relevance gate</text><text x="58" y="147" font-size="12" class="d" text-anchor="start">best reranked passage</text><text x="58" y="164" font-size="12" class="d" text-anchor="start">too weak: refuse, no LLM call</text><rect x="270" y="100" width="208" height="100" rx="12" fill="#161b22" stroke="#60a5fa" stroke-width="1.5"/><rect x="270" y="112" width="4" height="76" rx="2" fill="#60a5fa"/><text x="288" y="127" font-size="15" class="b" text-anchor="start">Cited generation</text><text x="288" y="147" font-size="12" class="d" text-anchor="start">each sentence ends with [n]</text><text x="288" y="164" font-size="12" class="d" text-anchor="start">or the model says NO_ANSWER</text><path d="M248 150L268 150" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="500" y="100" width="208" height="100" rx="12" fill="#161b22" stroke="#a78bfa" stroke-width="1.5"/><rect x="500" y="112" width="4" height="76" rx="2" fill="#a78bfa"/><text x="518" y="127" font-size="15" class="b" text-anchor="start">Sentence check</text><text x="518" y="147" font-size="12" class="d" text-anchor="start">content words + every number</text><text x="518" y="164" font-size="12" class="d" text-anchor="start">must be in the cited passage</text><path d="M478 150L498 150" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="730" y="100" width="208" height="100" rx="12" fill="#161b22" stroke="#fbbf24" stroke-width="1.5"/><rect x="730" y="112" width="4" height="76" rx="2" fill="#fbbf24"/><text x="748" y="127" font-size="15" class="b" text-anchor="start">Re-attribute / drop</text><text x="748" y="147" font-size="12" class="d" text-anchor="start">moved to the passage that</text><text x="748" y="164" font-size="12" class="d" text-anchor="start">supports it, else removed</text><path d="M708 150L728 150" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="960" y="100" width="208" height="100" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><rect x="960" y="112" width="4" height="76" rx="2" fill="#3fb950"/><text x="978" y="127" font-size="15" class="b" text-anchor="start">Quote + citation</text><text x="978" y="147" font-size="12" class="d" text-anchor="start">best matching source</text><text x="978" y="164" font-size="12" class="d" text-anchor="start">sentence attached</text><path d="M938 150L958 150" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="40" y="226" width="262" height="96" rx="12" fill="#161b22" stroke="#30363d"/><text x="58" y="274" font-size="36" class="b" text-anchor="start" fill="#2dd4bf">96%</text><text x="58" y="300" font-size="12" class="d" text-anchor="start">unanswerable questions refused (48/50)</text><rect x="322" y="226" width="262" height="96" rx="12" fill="#161b22" stroke="#30363d"/><text x="340" y="274" font-size="36" class="b" text-anchor="start" fill="#60a5fa">100%</text><text x="340" y="300" font-size="12" class="d" text-anchor="start">of 30 fresh trap questions refused</text><rect x="604" y="226" width="262" height="96" rx="12" fill="#161b22" stroke="#30363d"/><text x="622" y="274" font-size="36" class="b" text-anchor="start" fill="#a78bfa">96.2%</text><text x="622" y="300" font-size="12" class="d" text-anchor="start">of given answers are correct</text><rect x="886" y="226" width="262" height="96" rx="12" fill="#161b22" stroke="#30363d"/><text x="904" y="274" font-size="36" class="b" text-anchor="start" fill="#fbbf24">98.3%</text><text x="904" y="300" font-size="12" class="d" text-anchor="start">of correct answers cite the evidence</text></svg>