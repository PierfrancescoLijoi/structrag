<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="structrag: 94.7% correct answers, 96.2% precision, 96% unanswerable refused, 98.3% citations verified"><title>structrag: 94.7% correct answers, 96.2% precision, 96% unanswerable refused, 98.3% citations verified</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs><style>text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#e6edf3}.d{fill:#8b949e}.b{font-weight:700}</style><rect width="1200" height="400" rx="18" fill="#0d1117"/><rect x="0" y="0" width="1200" height="6" fill="url(#g)"/><text x="60" y="92" font-size="58" class="b" text-anchor="start" fill="url(#g)">structrag</text><text x="60" y="132" font-size="24" class="" text-anchor="start">Local-first RAG that understands document structure.</text><text x="60" y="162" font-size="15" class="d" text-anchor="start">Answers with cited quotes, or an honest “not in the documents”. Everything on your machine: CPU, open models, no API key.</text><rect x="60" y="200" width="260" height="130" rx="14" fill="#161b22" stroke="#30363d"/><rect x="60" y="200" width="260" height="4" rx="2" fill="#2dd4bf"/><text x="80" y="262" font-size="46" class="b" text-anchor="start" fill="#2dd4bf">94.7%</text><text x="80" y="292" font-size="15" class="b" text-anchor="start">correct answers</text><text x="80" y="313" font-size="11.5" class="d" text-anchor="start">237 questions · 28 documents in one index</text><rect x="340" y="200" width="260" height="130" rx="14" fill="#161b22" stroke="#30363d"/><rect x="340" y="200" width="260" height="4" rx="2" fill="#60a5fa"/><text x="360" y="262" font-size="46" class="b" text-anchor="start" fill="#60a5fa">96.2%</text><text x="360" y="292" font-size="15" class="b" text-anchor="start">precision of answers given</text><text x="360" y="313" font-size="11.5" class="d" text-anchor="start">when it answers, it is right</text><rect x="620" y="200" width="260" height="130" rx="14" fill="#161b22" stroke="#30363d"/><rect x="620" y="200" width="260" height="4" rx="2" fill="#a78bfa"/><text x="640" y="262" font-size="46" class="b" text-anchor="start" fill="#a78bfa">96%</text><text x="640" y="292" font-size="15" class="b" text-anchor="start">unanswerable refused</text><text x="640" y="313" font-size="11.5" class="d" text-anchor="start">48 of 50 trap questions</text><rect x="900" y="200" width="260" height="130" rx="14" fill="#161b22" stroke="#30363d"/><rect x="900" y="200" width="260" height="4" rx="2" fill="#fbbf24"/><text x="920" y="262" font-size="46" class="b" text-anchor="start" fill="#fbbf24">98.3%</text><text x="920" y="292" font-size="15" class="b" text-anchor="start">citations verified</text><text x="920" y="313" font-size="11.5" class="d" text-anchor="start">the cited passage holds the evidence</text><text x="60" y="368" font-size="13" class="d" text-anchor="start">Apache-2.0 · Python 3.11+ · PDF · DOCX · PPTX · XLSX · Markdown · scans &amp; figures (OCR) · Italian + English</text></svg>