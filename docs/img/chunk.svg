<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Anatomy of a chunk: a section path as breadcrumb, a text body packed by paragraphs, tables cut by rows with the header repeated, figures as their own chunk"><title>Anatomy of a chunk</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs><style>text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#e6edf3}.d{fill:#8b949e}.b{font-weight:700}.m{white-space:pre;font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}</style><rect width="1200" height="560" rx="18" fill="#0d1117"/><text x="60" y="50" font-size="26" class="b">Anatomy of a chunk</text><text x="60" y="74" font-size="14" class="d">Every chunk knows where it sits in the document, so it can be found, quoted and cited on its own.</text>

<rect x="40" y="100" width="270" height="226" rx="12" fill="#161b22" stroke="#30363d"/><text x="58" y="127" font-size="15" class="b">1. Section tree</text><text x="58" y="146" font-size="12" class="d">built by the structure cascade</text>
<text x="58" y="178" font-size="12" class="m">Attention Is All You Need</text>
<path d="M66 186V250" stroke="#30363d" stroke-width="1.5" fill="none"/>
<path d="M66 204H80M66 228H80M66 250H80" stroke="#30363d" stroke-width="1.5" fill="none"/>
<text x="86" y="208" font-size="12" class="m">1 Introduction</text>
<text x="86" y="232" font-size="12" class="m">3 Model Architecture</text>
<path d="M92 240V272" stroke="#30363d" stroke-width="1.5" fill="none"/>
<path d="M92 262H106" stroke="#30363d" stroke-width="1.5" fill="none"/>
<rect x="106" y="248" width="190" height="28" rx="7" fill="#0f2f2c" stroke="#2dd4bf" stroke-width="1.5"/><text x="116" y="266" font-size="12" class="m">3.2 Attention</text>
<text x="86" y="300" font-size="12" class="m">4 Why Self-Attention</text>
<path d="M296 262H342" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

<rect x="346" y="100" width="470" height="226" rx="12" fill="#161b22" stroke="#2dd4bf" stroke-width="1.5"/><rect x="346" y="112" width="4" height="202" rx="2" fill="#2dd4bf"/>
<text x="366" y="127" font-size="15" class="b">2. A text chunk</text><text x="800" y="127" font-size="12" class="d" text-anchor="end">kind: text · loc: p.4</text>
<rect x="366" y="140" width="430" height="30" rx="7" fill="#0f2f2c"/><text x="378" y="159" font-size="11.5" class="m" fill="#2dd4bf" style="fill:#2dd4bf">Attention Is All You Need &gt; 3 Model Architecture &gt; 3.2 Attention</text>
<text x="366" y="196" font-size="12.5">Scaled dot-product attention divides the scores by √d_k before</text>
<text x="366" y="216" font-size="12.5">the softmax, so large key dimensions do not push the weights</text>
<text x="366" y="236" font-size="12.5">into regions with very small gradients. Multi-head attention runs</text>
<text x="366" y="256" font-size="12.5">this several times in parallel on learned projections …</text>
<path d="M366 272H796" stroke="#30363d" stroke-dasharray="3 4"/>
<text x="366" y="293" font-size="12" class="d"><tspan style="fill:#2dd4bf" class="b">breadcrumb + text = ctx</tspan>: embedded and indexed (dense vectors + BM25)</text>
<text x="366" y="313" font-size="12" class="d"><tspan style="fill:#2dd4bf" class="b">text</tspan>: the part shown, quoted and cited in an answer</text>

<rect x="836" y="100" width="332" height="226" rx="12" fill="#161b22" stroke="#30363d"/><text x="854" y="127" font-size="15" class="b">3. Packing rules</text>
<circle cx="860" cy="154" r="3.5" fill="#2dd4bf"/><text x="874" y="158" font-size="12.5">Never crosses a section boundary</text>
<circle cx="860" cy="184" r="3.5" fill="#60a5fa"/><text x="874" y="188" font-size="12.5">Paragraphs packed to ~180 words</text>
<circle cx="860" cy="214" r="3.5" fill="#a78bfa"/><text x="874" y="218" font-size="12.5">Over 260 words: split by sentence</text>
<circle cx="860" cy="244" r="3.5" fill="#fbbf24"/><text x="874" y="248" font-size="12.5">Tables cut by rows, header repeated</text>
<circle cx="860" cy="274" r="3.5" fill="#3fb950"/><text x="874" y="278" font-size="12.5">A figure is its own chunk</text>
<text x="854" y="308" font-size="11.5" class="d">Page, slide or sheet is kept as loc.</text>

<rect x="40" y="350" width="370" height="184" rx="12" fill="#161b22" stroke="#60a5fa" stroke-width="1.5"/><rect x="40" y="362" width="4" height="160" rx="2" fill="#60a5fa"/>
<text x="60" y="377" font-size="15" class="b">A table chunk</text><text x="394" y="377" font-size="12" class="d" text-anchor="end">kind: table · p.5 rows 1-20</text>
<rect x="60" y="388" width="330" height="26" rx="7" fill="#0d2238"/><text x="70" y="405" font-size="11" class="m" style="fill:#60a5fa">… &gt; 4 Why Self-Attention &gt; Table 1</text>
<text x="60" y="436" font-size="11.5" class="m">| Layer type     | Complexity per layer |</text>
<text x="60" y="454" font-size="11.5" class="m d">| ---            | ---                  |</text>
<text x="60" y="472" font-size="11.5" class="m">| Self-Attention | O(n² · d)            |</text>
<text x="60" y="490" font-size="11.5" class="m">| Recurrent      | O(n · d²)            |</text>
<text x="60" y="516" font-size="11.5" class="d">Next 20 rows start with the same header,</text>
<text x="60" y="530" font-size="11.5" class="d">so each table chunk reads on its own.</text>

<rect x="430" y="350" width="370" height="184" rx="12" fill="#161b22" stroke="#a78bfa" stroke-width="1.5"/><rect x="430" y="362" width="4" height="160" rx="2" fill="#a78bfa"/>
<text x="450" y="377" font-size="15" class="b">A figure chunk</text><text x="784" y="377" font-size="12" class="d" text-anchor="end">kind: image · p.4</text>
<rect x="450" y="388" width="330" height="26" rx="7" fill="#1d1738"/><text x="460" y="405" font-size="11" class="m" style="fill:#a78bfa">… &gt; 3.2 Attention &gt; Figure 2</text>
<rect x="450" y="426" width="86" height="64" rx="8" fill="#0d1117" stroke="#30363d"/><path d="M462 478L480 452L494 466L508 444L524 478Z" fill="#241d44" stroke="#a78bfa" stroke-width="1.2"/><text x="493" y="504" font-size="10.5" class="d" text-anchor="middle">thumbnail</text>
<text x="552" y="440" font-size="12">Caption and OCR text</text>
<text x="552" y="458" font-size="12" class="d">of the figure, kept apart</text>
<text x="552" y="476" font-size="12" class="d">from the prose so it does</text>
<text x="552" y="494" font-size="12" class="d">not blur into the text.</text>
<text x="450" y="526" font-size="11.5" class="d">The answer can show the picture itself.</text>

<rect x="820" y="350" width="348" height="184" rx="12" fill="#161b22" stroke="#fbbf24" stroke-width="1.5"/><rect x="820" y="362" width="4" height="160" rx="2" fill="#fbbf24"/>
<text x="840" y="377" font-size="15" class="b">Stored with every chunk</text>
<text x="840" y="404" font-size="12" class="m" style="fill:#fbbf24">text</text><text x="900" y="404" font-size="12" class="d">the quotable body</text>
<text x="840" y="426" font-size="12" class="m" style="fill:#fbbf24">ctx</text><text x="900" y="426" font-size="12" class="d">breadcrumb + body, indexed</text>
<text x="840" y="448" font-size="12" class="m" style="fill:#fbbf24">kind, loc</text><text x="920" y="448" font-size="12" class="d">text · table · image, page</text>
<text x="840" y="470" font-size="12" class="m" style="fill:#fbbf24">emb</text><text x="900" y="470" font-size="12" class="d">384-d vector, local model</text>
<text x="840" y="492" font-size="12" class="m" style="fill:#fbbf24">links</text><text x="900" y="492" font-size="12" class="d">→ Figure 2 · ← Table 1</text>
<text x="840" y="518" font-size="11.5" class="d">Personal data is masked before this is written.</text>
</svg>
